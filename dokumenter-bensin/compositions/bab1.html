      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #061a30; }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
              font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; }

      /* ---------- stage & world (the giant blueprint) ---------- */
      #stage { overflow: hidden; background: #061a30; }
      #world {
        position: absolute; top: 0; left: 0;
        width: 4600px; height: 3100px;
        transform-origin: 0 0;
        background-color: #0b2f56;
        background-image:
          linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px),
          linear-gradient(rgba(255,255,255,.11) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.11) 1px, transparent 1px);
        background-size: 46px 46px, 46px 46px, 230px 230px, 230px 230px;
        box-shadow: inset 0 0 600px rgba(0,0,0,.55);
      }
      #sheet { position: absolute; top: 0; left: 0; }

      /* ---------- HUD (kaca jendela / skala) ---------- */
      #hud { pointer-events: none; }
      .brackets { position: absolute; top: 0; left: 0; }
      .meta { position: absolute; color: #cfe9ff; text-transform: uppercase; }
      .tlblk { top: 42px; left: 46px; }
      .bab { font-size: 42px; font-weight: 700; letter-spacing: 6px; color: #7ef0ff; }
      .ttl { font-size: 24px; letter-spacing: 8px; margin-top: 8px; opacity: .9; }
      .trblk { top: 50px; right: 46px; text-align: right; font-size: 20px;
               letter-spacing: 5px; opacity: .75; line-height: 1.7; }
      .blblk { bottom: 66px; left: 46px; font-size: 18px; letter-spacing: 4px; opacity: .7; }
      .brblk { bottom: 66px; right: 46px; font-size: 18px; letter-spacing: 4px;
               opacity: .7; text-align: right; }

      /* ---------- caption bar ---------- */
      #c0, #cA, #cB, #cD, #cC {
        position: absolute; left: 46px; bottom: 120px; width: 1700px;
        height: auto; inset: auto 46px auto 46px; width: auto;
        font-size: 30px; letter-spacing: 3px; color: #eaf6ff;
        text-transform: uppercase; line-height: 1.5;
        text-shadow: 0 3px 18px rgba(0,0,0,.9);
      }
      #c0::before, #cA::before, #cB::before, #cD::before, #cC::before {
        content: ""; display: inline-block; width: 26px; height: 30px;
        background: #7ef0ff; margin-right: 22px; vertical-align: -4px;
      }

      /* ---------- progress ---------- */
      #barwrap { position: absolute; left: 0; bottom: 0; width: 1920px; height: 8px;
                 background: rgba(255,255,255,.14); }
      #bar { position: absolute; left: 0; top: 0; width: 1920px; height: 8px;
             background: linear-gradient(90deg, #7ef0ff, #4bb9ff);
             transform-origin: 0 50%; }

      /* ---------- vignette ---------- */
      #vig { position: absolute; inset: 0; pointer-events: none;
             background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const VW = 1920, VH = 1080;

      // kamera virtual: fokuskan titik (cx,cy) di layar, dengan skala s
      function cam(cx, cy, s) {
        return { x: VW / 2 - cx * s, y: VH / 2 - cy * s, scale: s };
      }
      const F = {
        wide: [2300, 1550, 0.34],
        A:    [1270,  770, 0.78],
        B:    [1270, 1930, 0.78],
        D:    [3300,  770, 0.78],
        Dt:   [3300,  930, 1.16],
        C:    [3300, 1930, 0.78]
      };
      function go(k, at, dur) {
        const t = cam(F[k][0], F[k][1], F[k][2]);
        tl.to("#world", { x: t.x, y: t.y, scale: t.s, duration: dur, ease: "power2.inOut" }, at);
      }
      function spot(id, at, out) {
        tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, at);
        tl.to("#" + id, { opacity: 0, duration: 0.4, ease: "power1.in" }, out);
      }

      const w0 = cam(F.wide[0], F.wide[1], F.wide[2]);
      gsap.set("#world", { transformOrigin: "0px 0px", x: w0.x, y: w0.y, scale: w0.s, opacity: 0 });
      tl.to("#world", { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);

      // --- pelayaran kamera, diselaraskan dengan jeda kalimat (beats.json) ---
      go("A", 1.13, 1.30);   // sampai 2.43  "jutaan kendaraan berhenti..."
      go("B", 5.68, 1.25);   // sampai 6.93  "Kita mengisi, membayar..."
      go("D", 9.53, 1.27);   // sampai 10.80 "Tapi pernahkah kita bertanya"
      go("Dt", 12.56, 1.30); // sampai 13.86 "dari mana cairan ini datang"
      go("C", 14.85, 1.25);  // sampai 16.10 "ke mana ia pergi setelah menyala"
      go("wide", 17.30, 1.06); // tarik mundur ke skema penuh

      spot("spotA", 2.43, 5.68);
      spot("spotB", 6.93, 9.53);
      spot("spotD", 10.80, 14.85);
      spot("spotC", 16.10, 17.30);

      tl.fromTo("#bar", { scaleX: 0 },
                { scaleX: 1, duration: 18.36, ease: "none", transformOrigin: "0px 50%" }, 0);

      window.__timelines["bab1"] = tl;
      tl.seek(0);
